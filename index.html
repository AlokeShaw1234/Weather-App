<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="weather.css">
    <title>Weather App</title>
</head>
<body>
    <h1>Weather App</h1>
    <div class="container">

        <div>
            <form class="form" action="#">
                <input id="city-name" type="text" placeholder="Enter location" spellcheck="false">
                <button type="submit">Search</button>
            </form>
            
           <div class="weather-data">

                <div class="temp">
                    <p></p>
                </div>

                <div class="description">
                    <p></p>
                </div>

                <div class="details">
                    <div>
                        <p>Feels like</p>
                    </div>
                    <div>
                        <p>Humidity</p>
                    </div>
                    <div>
                        <p>Wind Speed</p>
                    </div>
                </div>
           </div>
        </div>
    </div>
    <script src="weather.js"></script>
</body>
</html>
